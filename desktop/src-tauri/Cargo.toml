[package]
name = "ctb-desktop"
version = "0.1.0"
description = "Cesium Terrain Builder 桌面端"
authors = ["Jin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ctb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

